name: Validate Team Follow-Up

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend validation dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test frontend and built-in data API
        run: npm test

      - name: Build the Amplify artifact
        run: npm run build

      - name: Test backend helpers
        run: python -m unittest discover -s backend/tests -v

      - name: Check infrastructure contract and DynamoDB index usage
        run: python scripts/test-infrastructure.py

      - name: Compile Python handlers and admin scripts
        run: python -m py_compile backend/src/handler.py backend/scripts/*.py

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate AWS SAM / CloudFormation template
        run: sam validate --lint --template-file backend/template.yaml

      - name: Build Lambda deployment artifact
        run: sam build --template-file backend/template.yaml
