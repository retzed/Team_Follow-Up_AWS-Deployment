AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Team Follow-Up API backend for existing Cognito and DynamoDB resources; it does not create or own those data resources."
# Uses the manually created Cognito pool/client and four existing DynamoDB tables through parameters.
# Do not add DynamoDB/Cognito resource definitions here unless an explicit migration/adoption plan is approved.
Parameters:
  TableNamePrefix:
    Type: String
    Default: TeamFollowUp
    Description: Prefix for API, Lambda, log, alarm, and dashboard names only. Existing DynamoDB table names are supplied separately.
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,19}$'
    ConstraintDescription: Use 3-20 letters, numbers, dots, underscores, or hyphens.
  ExistingCognitoUserPoolId:
    Type: String
    Default: us-east-1_7dYZw2Is6
    Description: Existing Cognito User Pool ID in this Region; the stack reuses it and does not create a pool.
    AllowedPattern: '^[A-Za-z0-9_-]+_[A-Za-z0-9]+$'
    ConstraintDescription: Enter the existing Cognito User Pool ID.
  ExistingCognitoAppClientId:
    Type: String
    Default: 7id8c2g27fvbh365atqntqurir
    Description: Existing public browser app client ID; it must have no client secret and support the frontend sign-in flow.
    AllowedPattern: '^[A-Za-z0-9]+$'
    ConstraintDescription: Enter the existing Cognito app client ID.
  ExistingItemsTableName:
    Type: String
    Default: TeamFollowUp-Items
    Description: Existing Items table; this stack does not create or manage it.
    AllowedPattern: '^[A-Za-z0-9_.-]{3,255}$'
  ExistingActivityTableName:
    Type: String
    Default: TeamFollowUp-Activity
    Description: Existing Activity table keyed by itemId + activityKey; this stack does not create or manage it.
    AllowedPattern: '^[A-Za-z0-9_.-]{3,255}$'
  ExistingUsersTableName:
    Type: String
    Default: TeamFollowUp-Users
    Description: Existing Users table keyed by userId; this stack does not create or manage it.
    AllowedPattern: '^[A-Za-z0-9_.-]{3,255}$'
  ExistingArchiveTableName:
    Type: String
    Default: TeamFollowUp-Archive
    Description: Existing Archive table keyed by archiveId; this stack does not create or manage it.
    AllowedPattern: '^[A-Za-z0-9_.-]{3,255}$'
  AllowedOrigin:
    Type: String
    Description: Exact HTTPS origin of the deployed Amplify site (scheme + host only; no path or trailing slash).
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?$'
    ConstraintDescription: Enter the deployed Amplify HTTPS origin, for example https://main.abc123.amplifyapp.com.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
    Description: CloudWatch log retention period.
Globals:
  Function:
    Runtime: python3.12
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        WORK_ITEMS_TABLE: !Ref ExistingItemsTableName
        ACTIVITY_TABLE: !Ref ExistingActivityTableName
        USER_PROFILES_TABLE: !Ref ExistingUsersTableName
        ARCHIVE_TABLE: !Ref ExistingArchiveTableName
Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${TableNamePrefix}/apigateway/access'
      RetentionInDays: !Ref LogRetentionDays

  TeamFollowUpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub '${TableNamePrefix} API'
          version: '1.0'
        paths: {}
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","method":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationErrorMessage":"$context.integrationErrorMessage"}'
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingCognitoUserPoolId}'
              audience: [!Ref ExistingCognitoAppClientId]
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${TableNamePrefix}-Api'
      RetentionInDays: !Ref LogRetentionDays
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${TableNamePrefix}-Api'
      CodeUri: backend/src/
      Handler: handler.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref ApiFunctionLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadExistingApplicationTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingItemsTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingItemsTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingActivityTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingActivityTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingUsersTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingUsersTableName}/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingArchiveTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingArchiveTableName}/index/*'
            - Sid: AllowPartialRestoreActivitySummaries
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
              Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingActivityTableName}'
            - Sid: AllowTransactionalItemOperationsOnly
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingItemsTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingActivityTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingArchiveTableName}'
              Condition:
                ForAnyValue:StringEquals:
                  dynamodb:EnclosingOperation:
                    - TransactWriteItems
            - Sid: AllowAtomicWorkItemArchiveAndAuditTransactions
              Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingItemsTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingActivityTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingArchiveTableName}'
      Events:
        AllRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref TeamFollowUpApi
            Path: /{proxy+}
            Method: ANY
  ApiLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableNamePrefix}-Lambda-Errors'
      AlarmDescription: The Team Follow-Up API Lambda returned an error during the evaluation period. Configure an SNS action after deployment if notifications are required.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ApiLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableNamePrefix}-Lambda-Throttles'
      AlarmDescription: The Team Follow-Up API Lambda was throttled during the evaluation period. Configure an SNS action after deployment if notifications are required.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableNamePrefix}-ApiGateway-5xx'
      AlarmDescription: API Gateway returned at least one 5xx response during the evaluation period. Configure an SNS action after deployment if notifications are required.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref TeamFollowUpApi
        - Name: Stage
          Value: '$default'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  TeamFollowUpDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${TableNamePrefix}-Operations'
      DashboardBody: !Sub |
        {
          "start": "-PT6H",
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda invocations, errors, and throttles",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${TableNamePrefix}-Api"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${TableNamePrefix}-Api"],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${TableNamePrefix}-Api"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway request volume and 5xx errors",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${TeamFollowUpApi}", "Stage", "$default"],
                  ["AWS/ApiGateway", "5xx", "ApiId", "${TeamFollowUpApi}", "Stage", "$default"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda duration",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 300,
                "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${TableNamePrefix}-Api", {"stat": "p95"}]]
              }
            }
          ]
        }
Outputs:
  CognitoUserPoolId:
    Description: Existing User Pool ID reused by the backend; set the same value in Amplify Hosting.
    Value: !Ref ExistingCognitoUserPoolId
  CognitoUserPoolClientId:
    Description: Existing public app client ID reused by the backend; set the same value in Amplify Hosting.
    Value: !Ref ExistingCognitoAppClientId
  CloudWatchDashboardName:
    Description: CloudWatch operations dashboard.
    Value: !Ref TeamFollowUpDashboard
  ApiBaseUrl:
    Description: API Gateway HTTPS base URL; configure dataMode='api' and apiBaseUrl in index.html to use the real backend.
    Value: !Sub 'https://${TeamFollowUpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ItemsTableName:
    Description: Existing Items table name; not created or managed by this stack.
    Value: !Ref ExistingItemsTableName
  ActivityTableName:
    Description: Existing Activity table name; retains its itemId + activityKey primary key.
    Value: !Ref ExistingActivityTableName
  UsersTableName:
    Description: Existing Users table name; profile lookup scans this small table because it has no Cognito-subject GSI.
    Value: !Ref ExistingUsersTableName
  ArchiveTableName:
    Description: Existing Archive table name; not created or managed by this stack.
    Value: !Ref ExistingArchiveTableName
