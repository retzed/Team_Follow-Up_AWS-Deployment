<script>
(function(){
 const root=document.documentElement;
 root.classList.add('app-booting','auth-pending');
 let lang='en',theme='dark';
 try{
  const raw=(Array.isArray(navigator.languages)&&navigator.languages.length?navigator.languages[0]:navigator.language);
  if(typeof raw==='string'&&raw.trim()){
   const tag=raw.trim().toLowerCase();
   if(tag==='en'||tag.startsWith('en-'))lang='en';
   else if(tag==='ar'||tag.startsWith('ar-'))lang='ar';
  }
 }catch(e){lang='en';}
 // Resolve the OS theme independently of the browser's interface language.
 try{
  if(typeof window.matchMedia==='function'&&!window.matchMedia('(forced-colors: active)').matches){
   const dark=window.matchMedia('(prefers-color-scheme: dark)'),light=window.matchMedia('(prefers-color-scheme: light)');
   if(typeof dark.matches==='boolean'&&typeof light.matches==='boolean'&&dark.matches!==light.matches)theme=dark.matches?'dark':'light';
  }
 }catch(e){theme='dark';}
 root.lang=lang;root.dir=lang==='ar'?'rtl':'ltr';root.dataset.systemTheme=theme;root.dataset.theme=theme;
})();

<style id="workspace-search-tab-visual-refinement">
/* Keep the desktop search toggle completely outside the expanded sidebar. */
@media (min-width: 821px) {
  :root { --workspace-sidebar-width: 340px; }
  .sidebar-toggle-float[aria-expanded="true"] {
    inset-inline-start: calc((100vw - min(100vw, 1800px)) / 2 + var(--workspace-sidebar-width)) !important;
  }
}
@media (min-width: 821px) and (max-width: 1120px) {
  :root { --workspace-sidebar-width: 310px; }
}
@media (min-width: 1500px) {
  :root { --workspace-sidebar-width: 360px; }
}

/* Overview and Timeline feedback belongs to the underline, never a button box. */
:root {
  --tab-indicator-muted: rgba(91, 98, 232, .20);
  --tab-indicator-hover: rgba(69, 75, 208, .64);
  --tab-indicator-active: #454bd0;
  --tab-indicator-glow: rgba(69, 75, 208, .38);
}
:root[data-theme="dark"] {
  --tab-indicator-muted: rgba(145, 150, 255, .24);
  --tab-indicator-hover: rgba(182, 185, 255, .78);
  --tab-indicator-active: #b6b9ff;
  --tab-indicator-glow: rgba(145, 150, 255, .58);
}
.tabs .tab {
  box-shadow: none !important;
  filter: none !important;
  background: transparent !important;
  transition: color 160ms ease !important;
}
.tabs .tab::after {
  position: absolute;
  inset-inline: 0;
  bottom: -1px;
  content: "";
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--tab-indicator-muted);
  opacity: 1;
  box-shadow: none;
  transition: background-color 180ms ease, opacity 180ms ease, box-shadow 180ms ease;
}
.tabs .tab.active::after {
  background: var(--tab-indicator-active);
  opacity: 1;
  box-shadow: 0 0 6px 1px var(--tab-indicator-glow);
}
@media (hover: hover) and (pointer: fine) {
  .tabs .tab:not(.active):hover {
    color: var(--accent-2);
  }
  .tabs .tab:not(.active):hover::after {
    background: var(--tab-indicator-hover);
    box-shadow: 0 0 5px var(--tab-indicator-glow);
  }
}
.tabs .tab:focus-visible {
  outline: none !important;
  box-shadow: none !important;
}
.tabs .tab:focus-visible::after {
  background: var(--tab-indicator-active);
  box-shadow: 0 0 0 1px var(--tab-indicator-glow), 0 0 7px 1px var(--tab-indicator-glow);
}
.tabs .tab:not(:disabled):active {
  filter: none !important;
  box-shadow: none !important;
}
@media (prefers-reduced-motion: reduce) {
  .tabs .tab,
  .tabs .tab::after {
    transition: none !important;
  }
}
</style>

<style id="hierarchy-creator-and-unboxed-clear-refinement">
/* Clear actions are plain text controls in the sidebar, child filters and profile search.
   Remove every generic button surface in every interaction state. */
#clearParentFilters,
#mainContent .child-clear-button,
#accountPage .account-search-clear-button,
#clearParentFilters:hover,
#mainContent .child-clear-button:hover,
#accountPage .account-search-clear-button:hover,
#clearParentFilters:focus,
#mainContent .child-clear-button:focus,
#accountPage .account-search-clear-button:focus,
#clearParentFilters:focus-visible,
#mainContent .child-clear-button:focus-visible,
#accountPage .account-search-clear-button:focus-visible,
#clearParentFilters:active,
#mainContent .child-clear-button:active,
#accountPage .account-search-clear-button:active {
  -webkit-appearance: none !important;
  appearance: none !important;
  border: 0 !important;
  border-color: transparent !important;
  outline: 0 !important;
  background: transparent !important;
  background-image: none !important;
  box-shadow: none !important;
  border-radius: 0 !important;
  transform: none !important;
  filter: none !important;
}
#clearParentFilters::before,
#clearParentFilters::after,
#mainContent .child-clear-button::before,
#mainContent .child-clear-button::after,
#accountPage .account-search-clear-button::before,
#accountPage .account-search-clear-button::after {
  content: none !important;
  display: none !important;
}
#clearParentFilters:hover,
#mainContent .child-clear-button:hover,
#accountPage .account-search-clear-button:hover,
#clearParentFilters:focus-visible,
#mainContent .child-clear-button:focus-visible,
#accountPage .account-search-clear-button:focus-visible {
  color: var(--accent-2) !important;
  text-decoration: underline;
  text-underline-offset: 3px;
}
#clearParentFilters:active,
#mainContent .child-clear-button:active,
#accountPage .account-search-clear-button:active {
  opacity: .78;
}

/* Creator and creation-time details now live in the hierarchy, not Overview. */

 }else if(name==='helmet'){

 }else if(name==='layers'){

 }
 return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="url(#'+id+'-stroke)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+defs+'<g>'+body+'</g></svg>';

let currentPasswordVerificationSequence=0;
let verifiedCurrentPasswordOwner='';
let verifiedCurrentPasswordValue='';
let currentPasswordVerificationInFlight=null;
function setCurrentPasswordCheck(check,state){
 if(!check)return;
 const visible=state==='valid'||state==='invalid';
 check.hidden=!visible;
 check.classList.toggle('is-invalid',state==='invalid');
 check.textContent=state==='invalid'?'×':'✓';
 const label=state==='valid'?tr('passwordVerified'):state==='invalid'?tr('currentPasswordIncorrect'):tr('currentPassword');
 check.setAttribute('aria-label',label);
 check.title=label;
}
function updatePasswordMatchStatus(form){
 const first=String(form?.querySelector('#passwordNew')?.value||'');
 const second=String(form?.querySelector('#passwordConfirm')?.value||'');
 const status=form?.querySelector('#passwordChangeStatus');
 const matches=first.length>0&&second.length>0&&first===second;
 if(matches){
  if(status){status.textContent=tr('passwordsMatch');status.classList.remove('error');}
  return true;
 }
 if(status&&(status.textContent===tr('passwordsMatch')||status.textContent===tr('passwordMismatch'))){
  const currentInput=form.querySelector('#passwordCurrent');
  const check=form.querySelector('#passwordCurrentCheck');
  const auth=window.__TEAM_FOLLOW_UP_AUTH_CONTEXT;
  const owner=String(auth?.teamUserId||'');
  const verified=Boolean(currentInput&&check&&!check.hidden&&!check.classList.contains('is-invalid')&&verifiedCurrentPasswordOwner===owner&&verifiedCurrentPasswordValue===String(currentInput.value||''));
  const incorrect=Boolean(check&&!check.hidden&&check.classList.contains('is-invalid'));
  status.textContent=verified?tr('passwordVerified'):incorrect?tr('currentPasswordIncorrect'):'';
  status.classList.toggle('error',incorrect);
 }
 return false;
}
async function verifyCurrentPasswordField(input){
 const form=input?.closest?.('#accountPasswordForm');
 if(!form)return false;
 const value=String(input.value||''),check=form.querySelector('#passwordCurrentCheck'),status=form.querySelector('#passwordChangeStatus');
 const report=(message,isError=false)=>{if(status){status.textContent=message;status.classList.toggle('error',isError);}};
 const auth=window.__TEAM_FOLLOW_UP_AUTH_CONTEXT,owner=String(auth?.teamUserId||'');
 if(!value){
  currentPasswordVerificationSequence++;
  verifiedCurrentPasswordOwner='';verifiedCurrentPasswordValue='';currentPasswordVerificationInFlight=null;
  setCurrentPasswordCheck(check,'hidden');
  report('');
  return false;
 }
 if(verifiedCurrentPasswordOwner===owner&&verifiedCurrentPasswordValue===value&&check&&!check.hidden&&!check.classList.contains('is-invalid'))return true;
 if(currentPasswordVerificationInFlight?.owner===owner&&currentPasswordVerificationInFlight?.value===value)return currentPasswordVerificationInFlight.promise;
 if(!auth||typeof auth.verifyPassword!=='function'){
  verifiedCurrentPasswordOwner='';verifiedCurrentPasswordValue='';
  setCurrentPasswordCheck(check,'hidden');
  report(tr('passwordVerifyFailed'),true);return false;
 }
 const sequence=++currentPasswordVerificationSequence;
 setCurrentPasswordCheck(check,'hidden');
 report(tr('checkingPassword'));
 // Defer verification to a microtask so the in-flight record is assigned first,
 // including when the provider throws synchronously.
 const requestPromise=Promise.resolve().then(()=>auth.verifyPassword(value)).then(valid=>{
  if(sequence!==currentPasswordVerificationSequence||!input.isConnected||String(input.value||'')!==value)return false;
  if(valid===true){
   verifiedCurrentPasswordOwner=owner;verifiedCurrentPasswordValue=value;
   setCurrentPasswordCheck(check,'valid');
   report(tr('passwordVerified'));
   updatePasswordMatchStatus(form);
   return true;
  }
  verifiedCurrentPasswordOwner='';verifiedCurrentPasswordValue='';
  setCurrentPasswordCheck(check,'invalid');
  report(tr('currentPasswordIncorrect'),true);return false;
 },error=>{
  if(sequence!==currentPasswordVerificationSequence||!input.isConnected||String(input.value||'')!==value)return false;
  verifiedCurrentPasswordOwner='';verifiedCurrentPasswordValue='';
  setCurrentPasswordCheck(check,'hidden');
  report(tr('passwordVerifyFailed'),true);return false;
 }).finally(()=>{
  if(currentPasswordVerificationInFlight?.promise===requestPromise)currentPasswordVerificationInFlight=null;
 });
 currentPasswordVerificationInFlight={owner,value,promise:requestPromise};
 return requestPromise;
}
async function changeCurrentPassword(form){
 const fields=Object.fromEntries(new FormData(form).entries()),oldPassword=String(fields.currentPassword||''),newPassword=String(fields.newPassword||''),confirmPassword=String(fields.confirmPassword||'');

  form.reset();
    const currentCheck=form.querySelector('#passwordCurrentCheck');if(currentCheck)currentCheck.hidden=true;
  report(tr('passwordChanged'));
 }catch(error){

  const currentCheck=form.querySelector('#passwordCurrentCheck');if(currentCheck)currentCheck.hidden=true;

  if(button){button.disabled=false;button.innerHTML=icon('shield',13)+' '+esc(tr('changePassword'));}
 }
}

function assignableUsers(){

  const id=String(raw?.id||raw?.userId||'').trim().toLowerCase();
  const identityFields=[raw?.username,raw?.userName,raw?.role,raw?.roleName,raw?.privilege,raw?.level,raw?.accountType,raw?.userType];
  const hasRootIdentity=identityFields.some(value=>String(value??'').trim().toLowerCase()==='root');
  const systemFlag=raw?.isRoot===true||raw?.isSystem===true||raw?.isSystemUser===true||raw?.systemUser===true||raw?.root===true;
  return Boolean(id)&&id!=='root'&&!hasRootIdentity&&!systemFlag&&raw.enabled!==false;
 });
}
function isAssignableUserId(value){

 if(!Array.isArray(data.parents))data.parents=[];

function realtimeCatchupQueryCursor(){

async function applyRealtimeChangeBatch(changes){

   const id=String(rawId||'');if(!id)continue;topLevelIds.add(id);
   if(change.deleted)deletedRootIds.add(id);else updatedIds.add(id);
  }

 for(let start=0;start<resolveIds.length;start+=100){
  const result=await api.resolveItems(resolveIds.slice(start,start+100));
  resolved.push(...(result?.items||[]).map(row=>row?.id?row:toAppItem(row)));
 }

 const missing=resolveIds.filter(id=>!resolvedById.has(id));
 if(missing.length)throw new Error('A real-time item is not visible in the consistent item read yet: '+missing.join(', '));

  for(const row of [...(data.children||[])])if(String(row.rootParentId||'')===rootId){forgetRealtimeItem(row.id);removeRealtimeWorkspaceItem(row.id);}
  for(const [id,row] of [...realtimeItemOverlay])if(String(row.rootParentId||'')===rootId)forgetRealtimeItem(id);
  forgetRealtimeItem(rootId);removeRealtimeWorkspaceItem(rootId);
 }

 const activityRows=[];
 if(activityItemIds.length&&typeof api.queryActivityForItems==='function'){
  for(let start=0;start<activityItemIds.length;start+=100){
   const result=await api.queryActivityForItems(activityItemIds.slice(start,start+100));

 if(activityEvents.length){
  mergeActivityEventsIntoWorkspace(activityEvents);

  updateApplicationHistoryFromCommittedEvents(activityEvents);

  dataLoadState.childrenLoaded.delete([...deletedRootIds][0]);
 }
 const currentUserId=String(ui.actingUserId||rawCurrentUser()?.id||'');
 const assignedViewAffected=Boolean(currentUserId&&(assigneeIds.has(currentUserId)||assigneeIds.has('ALL_USERS')));
 if(assignedViewAffected){
  if(ui.accountAssignedLoading)realtimeAssignedRefreshPending=true;
  else if(ui.accountAssignedLoaded){
   const assigned=new Map((ui.accountAssignedRows||[]).map(row=>[String(row.id),row]));
   for(const id of new Set([...updatedIds,...deletedIds]))assigned.delete(id);
   for(const item of resolvedById.values())if(item.assigneeMode==='all'||(item.assigneeMode!=='none'&&(Array.isArray(item.assigneeIds)?item.assigneeIds:[item.ownerId]).some(id=>String(id||'')===currentUserId)))assigned.set(String(item.id),item);

 }

  const pinned=new Map((ui.accountPinnedRows||[]).map(row=>[String(row.id),row]));
  for(const id of new Set([...updatedIds,...deletedIds]))pinned.delete(id);
  for(const item of resolvedById.values())if(pinned.has(String(item.id)))pinned.set(String(item.id),item);
  ui.accountPinnedRows=[...pinned.values()];
  if(ui.page==='account'&&ui.accountTab==='pinned')renderAccountPage();

 if(parentListChanged)renderParentList({skipRemote:true});

 if(ui.page==='workspace'&&(selectedAffected||parentListChanged))renderDetail();

  const modalItem=allItem(ui.modal.itemId)||ui.modal.itemSnapshot;

  if(rootIds.has(modalRoot))activityRootsToRefresh.add(modalRoot);

async function catchUpRealtimeChanges(){
 if(!realtimeRunning)return;
 if(realtimeCatchupPromise){realtimeCatchupRequested=true;return realtimeCatchupPromise;}
 realtimeCatchupPromise=(async()=>{
  do{
   realtimeCatchupRequested=false;
   let pages=0,queryCursor=realtimeCatchupQueryCursor();
   while(realtimeRunning){
    const result=await window.TeamFollowUpDataApi.queryRealtimeChanges(queryCursor,{limit:100});
    const changes=Array.isArray(result?.changes)?result.changes:[];
    if(changes.length)await queueRealtimeChangeBatch(changes);
    const nextCursor=String(result?.nextCursor||queryCursor);
    const cursorAdvanced=nextCursor!==queryCursor;
    if(cursorAdvanced)queryCursor=nextCursor;
    if(nextCursor>realtimeCursor)realtimeCursor=nextCursor;
    if(!result?.hasMore)break;
    if(++pages>=20){realtimeCatchupRequested=true;break;}
    if(!cursorAdvanced&&!changes.length)break;
   }
  }while(realtimeRunning&&realtimeCatchupRequested);
 })().catch(error=>{
  console.warn('Real-time change catch-up failed; the durable cursor will be retried.',error);
  if(realtimeRunning)scheduleRealtimeCatchup(4000);
 }).finally(()=>{
  realtimeCatchupPromise=null;
  if(realtimeRunning&&realtimeCatchupRequested)scheduleRealtimeCatchup(0);
 });

}
async function connectRealtimeNotifications(generation){
 if(!realtimeRunning||generation!==realtimeGeneration||window.navigator?.onLine===false)return;
 const api=window.TeamFollowUpDataApi,cfg=window.TEAM_FOLLOW_UP_CONFIG||{};
 if(!api?.createRealtimeTicket||!api?.queryRealtimeChanges||typeof window.WebSocket!=='function')return;
 try{
  const ticketResult=await api.createRealtimeTicket();
  if(!realtimeRunning||generation!==realtimeGeneration)return;
  const ticket=String(ticketResult?.ticket||'');
  if(!ticket)throw new Error('The real-time service did not issue a connection ticket.');
  if(!realtimeCursor)realtimeCursor=String(ticketResult?.cursor||'');
  const endpoint=new URL(String(cfg.realtimeWebSocketUrl||''));
  if(endpoint.protocol!=='wss:')throw new Error('The real-time WebSocket endpoint is not configured.');
  endpoint.searchParams.set('ticket',ticket);
  const socket=new WebSocket(endpoint.toString());realtimeSocket=socket;
  socket.onopen=()=>{
   if(!realtimeRunning||generation!==realtimeGeneration||realtimeSocket!==socket){try{socket.close(1000,'Stale connection');}catch(error){}return;}
   realtimeReconnectDelay=1000;
   const ping=()=>{if(socket.readyState===WebSocket.OPEN){try{socket.send(JSON.stringify({action:'ping'}));}catch(error){try{socket.close();}catch(closeError){}}}};
   clearRealtimeHeartbeat();ping();realtimeHeartbeatTimer=setInterval(()=>{ping();scheduleRealtimeCatchup(0);},4*60*1000);
   synchronizeRealtimeInitialAssignments();
   scheduleRealtimeCatchup(0);
  };
  socket.onmessage=event=>{
   if(!realtimeRunning||generation!==realtimeGeneration)return;
   try{
    const message=JSON.parse(String(event.data||'{}'));
    if(message?.type==='items.changed'){
     void queueRealtimeChangeBatch([message]).then(()=>scheduleRealtimeCatchup(0)).catch(error=>{
      console.warn('Could not apply a pushed real-time change; durable catch-up will retry.',error);
      scheduleRealtimeCatchup(1000);
     });
    }
   }catch(error){console.warn('Ignored an invalid real-time notification.',error);}
  };
  socket.onerror=()=>{try{socket.close();}catch(error){}};
  socket.onclose=()=>{
   if(realtimeSocket===socket)realtimeSocket=null;
   clearRealtimeHeartbeat();scheduleRealtimeReconnect(generation);
  };
 }catch(error){
  console.warn('Could not establish the real-time change channel; reconnect will be attempted.',error);
  scheduleRealtimeReconnect(generation);
 }
}
function startRealtimeNotifications(){
 const api=window.TeamFollowUpDataApi;

 // particular connection cannot be reached. Each tab keeps its own cursor.

}
function sendRealtimeHeartbeat(){

  try{realtimeSocket.send(JSON.stringify({action:'ping'}));}catch(error){try{realtimeSocket.close();}catch(closeError){}}
 }else if(realtimeRunning&&!realtimeReconnectTimer)scheduleRealtimeReconnect(realtimeGeneration);
}
window.addEventListener('online',()=>{if(realtimeRunning&&!realtimeSocket&&!realtimeReconnectTimer)scheduleRealtimeReconnect(realtimeGeneration);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&realtimeRunning){sendRealtimeHeartbeat();scheduleRealtimeCatchup(0);}});
window.addEventListener('pagehide',stopRealtimeNotifications);
window.addEventListener('pageshow',()=>{if(window.TeamFollowUpAuth&&window.__TEAM_FOLLOW_UP_AUTH_CONTEXT)startRealtimeNotifications();});

async function reconcileSelectedWorkspaceParent(){
 const selectedId=String(ui.selectedParentId||'');
 if(!selectedId)return 'empty';
 if(data.parents.some(parent=>String(parent.id)===selectedId))return 'present';
 const api=window.TeamFollowUpDataApi;
 if(!api||typeof api.resolveItems!=='function')return 'unknown';
 try{
  const result=await api.resolveItems([selectedId]);
  const selected=(result?.items||[]).find(item=>String(item.id||item.itemId||'')===selectedId&&['project','job'].includes(item.type));
  if(!selected)return 'missing';
  data.parents=[selected,...data.parents.filter(parent=>String(parent.id)!==selectedId)];
  invalidateHierarchyIndex();
  return 'present';
 }catch(error){
  // A temporary resolver failure must never discard the tab's saved selection.
  console.warn('Could not verify the restored workspace parent; keeping the tab selection.',error);
  return 'unknown';
 }
}

// Start with an empty workspace and populate it exclusively from the AWS API.

<script id="sync-sidebar-height-to-natural-main-content">
(() => {
  const sidebar = document.querySelector('.sidebar');
  const main = document.querySelector('.main');
  const layout = document.querySelector('.layout');
  if (!sidebar || !main || !layout) return;
  const desktop = window.matchMedia('(min-width: 821px)');
  let frame = 0;
  let observedChildren = new Set();
  const childResizeObserver = ('ResizeObserver' in window)
    ? new ResizeObserver(() => schedule()) : null;

  function observeMainChildren() {
    if (!childResizeObserver) return;
    const children = new Set(Array.from(main.children));
    for (const oldChild of observedChildren) {
      if (!children.has(oldChild)) childResizeObserver.unobserve(oldChild);
    }
    for (const child of children) {
      if (!observedChildren.has(child)) childResizeObserver.observe(child);
    }
    observedChildren = children;
  }

  function getNaturalMainHeight() {
    const mainRect = main.getBoundingClientRect();
    const mainStyle = getComputedStyle(main);
    const paddingBottom = parseFloat(mainStyle.paddingBottom) || 0;
    const borderBottom = parseFloat(mainStyle.borderBottomWidth) || 0;
    let furthestBottom = parseFloat(mainStyle.paddingTop) || 0;
    for (const child of Array.from(main.children)) {
      const style = getComputedStyle(child);
      if (style.display === 'none' || style.position === 'absolute' || style.position === 'fixed') continue;
      const rect = child.getBoundingClientRect();
      const marginBottom = parseFloat(style.marginBottom) || 0;
      furthestBottom = Math.max(furthestBottom, rect.bottom - mainRect.top + marginBottom);
    }
    const natural = furthestBottom + paddingBottom + borderBottom;
    const minLayoutHeight = parseFloat(getComputedStyle(layout).minHeight) || 0;
    return Math.max(natural, minLayoutHeight);
  }

  function sync() {
    if (!desktop.matches) {
      sidebar.style.height = '';
      return;
    }
    const height = getNaturalMainHeight();
    if (height > 0) {
      const next = `${Math.ceil(height)}px`;
      if (sidebar.style.height !== next) sidebar.style.height = next;
    }
  }

  function schedule() {
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      frame = 0;
      observeMainChildren();
      sync();
    });
  }

  window.addEventListener('resize', schedule, {passive: true});
  if (desktop.addEventListener) desktop.addEventListener('change', schedule);
  else if (desktop.addListener) desktop.addListener(schedule);
  if ('MutationObserver' in window) {
    const mainMutations = new MutationObserver(schedule);
    mainMutations.observe(main, {subtree: true, childList: true, characterData: true});
    const sidebarMutations = new MutationObserver(schedule);
    sidebarMutations.observe(sidebar, {subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden', 'class']});
  }
  observeMainChildren();
  window.addEventListener('load', schedule, {once: true});
  schedule();
})();
</script>

.scroll-to-top {
  position: fixed;
  inset-inline-end: 20px;
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  z-index: 35;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  min-width: 42px;
  min-height: 42px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--accent);
  box-shadow: var(--shadow);
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition:
    opacity 160ms ease,
    visibility 160ms ease,
    background-color 160ms ease,
    border-color 160ms ease,
    color 160ms ease,
    box-shadow 160ms ease;
}
.scroll-to-top.is-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.scroll-to-top svg {
  display: block;
  width: 18px;
  height: 18px;
  flex: none;
}
@media (hover: hover) and (pointer: fine) {
  .scroll-to-top.is-visible:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-2);
    box-shadow: var(--shadow), 0 0 0 2px var(--accent-soft);
  }
}
.scroll-to-top:focus-visible {
  outline: none;
  box-shadow: var(--shadow), var(--focus);
}
.scroll-to-top:active {
  background: var(--accent-soft);
  opacity: .82;
}
body.signin-open .scroll-to-top {
  display: none !important;
}
@media (max-width: 700px) {
  .scroll-to-top {
    inset-inline-end: 14px;
    bottom: max(14px, env(safe-area-inset-bottom, 0px));
    width: 40px;
    height: 40px;
    min-width: 40px;
    min-height: 40px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .scroll-to-top {
    transition: none !important;
  }
}
</style>

<script id="scroll-to-top-behavior">
(() => {
  'use strict';
  const button = document.getElementById('scrollToTopButton');
  const app = document.getElementById('app');
  if (!button || !app) return;

  const SHOW_AFTER_PX = 360;
  const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)');
  let updateFrame = 0;

  function pageScrollTop() {
    return Math.max(
      window.scrollY || 0,
      document.documentElement?.scrollTop || 0,
      document.body?.scrollTop || 0
    );
  }

  function updateVisibility() {
    updateFrame = 0;
    const signedIn = !app.inert && !document.body.classList.contains('signin-open');
    const visible = signedIn && pageScrollTop() >= SHOW_AFTER_PX;
    button.classList.toggle('is-visible', visible);
    button.setAttribute('aria-hidden', String(!visible));
    button.tabIndex = visible ? 0 : -1;

    const label = document.documentElement.lang === 'ar'
      ? 'العودة إلى أعلى الصفحة'
      : 'Back to top';
    button.setAttribute('aria-label', label);
    button.title = label;
  }

  function scheduleVisibilityUpdate() {
    if (updateFrame) return;
    updateFrame = window.requestAnimationFrame(updateVisibility);
  }

  window.addEventListener('scroll', scheduleVisibilityUpdate, { passive: true });
  window.addEventListener('resize', scheduleVisibilityUpdate, { passive: true });

  button.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      left: 0,
      behavior: reduceMotion?.matches ? 'auto' : 'smooth'
    });
  });

  const authObserver = new MutationObserver(scheduleVisibilityUpdate);
  authObserver.observe(app, {
    attributes: true,
    attributeFilter: ['inert', 'aria-hidden']
  });
  authObserver.observe(document.body, {
    attributes: true,
    attributeFilter: ['class']
  });
  authObserver.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['lang']
  });

  updateVisibility();
})();
</script>
