<script id="sync-sidebar-height-to-natural-main-content">
(() => {
  const sidebar = document.querySelector('.sidebar');
  const main = document.querySelector('.main');
  const layout = document.querySelector('.layout');
  if (!sidebar || !main || !layout) return;
  const desktop = window.matchMedia('(min-width: 821px)');
  let frame = 0;
  let observedChildren = new Set();
  const childResizeObserver = ('ResizeObserver' in window)
    ? new ResizeObserver(() => schedule()) : null;

  function observeMainChildren() {
    if (!childResizeObserver) return;
    const children = new Set(Array.from(main.children));
    for (const oldChild of observedChildren) {
      if (!children.has(oldChild)) childResizeObserver.unobserve(oldChild);
    }
    for (const child of children) {
      if (!observedChildren.has(child)) childResizeObserver.observe(child);
    }
    observedChildren = children;
  }

  function getNaturalMainHeight() {
    const mainRect = main.getBoundingClientRect();
    const mainStyle = getComputedStyle(main);
    const paddingBottom = parseFloat(mainStyle.paddingBottom) || 0;
    const borderBottom = parseFloat(mainStyle.borderBottomWidth) || 0;
    let furthestBottom = parseFloat(mainStyle.paddingTop) || 0;
    for (const child of Array.from(main.children)) {
      const style = getComputedStyle(child);
      if (style.display === 'none' || style.position === 'absolute' || style.position === 'fixed') continue;
      const rect = child.getBoundingClientRect();
      const marginBottom = parseFloat(style.marginBottom) || 0;
      furthestBottom = Math.max(furthestBottom, rect.bottom - mainRect.top + marginBottom);
    }
    const natural = furthestBottom + paddingBottom + borderBottom;
    const minLayoutHeight = parseFloat(getComputedStyle(layout).minHeight) || 0;
    return Math.max(natural, minLayoutHeight);
  }

  function sync() {
    if (!desktop.matches) {
      sidebar.style.height = '';
      return;
    }
    const height = getNaturalMainHeight();
    if (height > 0) {
      const next = `${Math.ceil(height)}px`;
      if (sidebar.style.height !== next) sidebar.style.height = next;
    }
  }

  function schedule() {
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      frame = 0;
      observeMainChildren();
      sync();
    });
  }

  window.addEventListener('resize', schedule, {passive: true});
  if (desktop.addEventListener) desktop.addEventListener('change', schedule);
  else if (desktop.addListener) desktop.addListener(schedule);
  if ('MutationObserver' in window) {
    const mainMutations = new MutationObserver(schedule);
    mainMutations.observe(main, {subtree: true, childList: true, characterData: true});
    const sidebarMutations = new MutationObserver(schedule);
    sidebarMutations.observe(sidebar, {subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden', 'class']});
  }
  observeMainChildren();
  window.addEventListener('load', schedule, {once: true});
  schedule();
})();
</script>
